# /etc/modules: kernel modules to load at boot time.
#
# This file contains the names of kernel modules that should be loaded
# at boot time, one per line. Lines beginning with "#" are ignored.
#
# The iSMT (0000:00:12.0) and i801 (0000:00:1f.4) adapters must register
# their i2c buses before dell_n3248te_platform creates the top-level mux,
# so the PCA9548's channels consistently get bus numbers 2-9. That keeps
# the fan/temp channel on bus 7 and the syseeprom on bus 2, as expected
# by /etc/fancontrol and the sonic_platform API. Do not reorder i2c-i801
# below dell_n3248te_platform.

i2c-isch
i2c-ismt
i2c-i801
i2c-dev
i2c-mux
i2c-smbus

i2c-mux-pca954x
dell_n3248te_platform

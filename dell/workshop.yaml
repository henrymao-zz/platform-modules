name: dell-platform
base: ubuntu@26.04
sdks:
  - name: project-dell-build
actions:
  build: |
    mkdir -p /project/build
    sudo KVERSION=7.0.0-1002-sonic dpkg-buildpackage -d -b -uc -us
    mv /sonic-dell-platform-modules_*.deb /sonic-dell-platform-modules_*.buildinfo /sonic-dell-platform-modules_*.changes /project/build/ 2>/dev/null || true
    mv /platform-modules-*_*.deb /platform-modules-*_*.ddeb /project/build/ 2>/dev/null || true
  clean: |
    rm -rf /project/build
    find /project -type d -name 'build' -not -path '*/.git/*' -exec rm -rf {} + 2>/dev/null || true
  binary: |
    mkdir -p /project/build
    sudo KVERSION=7.0.0-1002-sonic dpkg-buildpackage -d -b -uc -us
    mv /sonic-dell-platform-modules_*.deb /sonic-dell-platform-modules_*.buildinfo /sonic-dell-platform-modules_*.changes /project/build/ 2>/dev/null || true
    mv /platform-modules-*_*.deb /platform-modules-*_*.ddeb /project/build/ 2>/dev/null || true
  binary-only: |
    mkdir -p /project/build
    sudo KVERSION=7.0.0-1002-sonic dpkg-buildpackage -d -B -uc -us
    mv /sonic-dell-platform-modules_*.deb /sonic-dell-platform-modules_*.buildinfo /sonic-dell-platform-modules_*.changes /project/build/ 2>/dev/null || true
    mv /platform-modules-*_*.deb /platform-modules-*_*.ddeb /project/build/ 2>/dev/null || true

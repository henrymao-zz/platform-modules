name: dell-platform
base: ubuntu@26.04
sdks:
  - name: project-dell-build
actions:
  build: |
    mkdir -p /project/build
    rsync -a /project/ /project/build/source/ --exclude='.git' --exclude='build' --exclude='.workshop.lock'
    for patch in /project/build/source/ubuntu/patches/*.patch; do
      [ -f "$patch" ] && patch -d /project/build/source -p1 < "$patch"
    done
    cd /project/build/source && sudo KVERSION=7.0.0-1002-sonic dpkg-buildpackage -d -b -uc -us
  clean: |
    rm -rf /project/build
    find /project -type d -name 'build' -not -path '*/.git/*' -exec rm -rf {} + 2>/dev/null || true
  binary: |
    mkdir -p /project/build
    rsync -a /project/ /project/build/source/ --exclude='.git' --exclude='build' --exclude='.workshop.lock'
    for patch in /project/build/source/ubuntu/patches/*.patch; do
      [ -f "$patch" ] && patch -d /project/build/source -p1 < "$patch"
    done
    cd /project/build/source && sudo KVERSION=7.0.0-1002-sonic dpkg-buildpackage -d -b -uc -us
  binary-only: |
    mkdir -p /project/build
    rsync -a /project/ /project/build/source/ --exclude='.git' --exclude='build' --exclude='.workshop.lock'
    for patch in /project/build/source/ubuntu/patches/*.patch; do
      [ -f "$patch" ] && patch -d /project/build/source -p1 < "$patch"
    done
    cd /project/build/source && sudo KVERSION=7.0.0-1002-sonic dpkg-buildpackage -d -B -uc -us
  source: |
    mkdir -p /project/build
    rsync -a /project/ /project/build/source/ --exclude='.git' --exclude='build' --exclude='.workshop.lock'
    mkdir -p /project/build/source/debian/patches
    cp /project/build/source/ubuntu/patches/*.patch /project/build/source/debian/patches/
    cd /project/build/source/debian/patches && ls -1 *.patch > series
    # PPAs reject 'main' as a section; use 'misc' instead
    sed -i 's/^Section: main$/Section: misc/' /project/build/source/debian/control
    # Fix install paths for pkgbinarymangler compliance
    find /project/build/source/debian -maxdepth 1 -name "*.install" -exec sed -i 's|usr/local/bin|usr/bin|g' {} +
    sed -i 's|usr/local/bin|usr/bin|g' /project/build/source/debian/rules
    # Extract upstream version (strip Debian revision, e.g. 1.8.0-1~ppa1 -> 1.8.0)
    UPSTREAM_VER=$(cd /project/build/source && dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
    PKG_NAME=sonic-dell-platform-modules
    BUILD_DIR=/project/build
    orig_tarball="${BUILD_DIR}/${PKG_NAME}_${UPSTREAM_VER}.orig.tar.xz"
    # Create orig tarball from clean source (excluding debian/)
    tar --exclude='source/debian' --exclude='source/.workshop.lock' -cJf "${orig_tarball}" -C "${BUILD_DIR}" source/
    cd /project/build/source && dpkg-source -b .
    # Unapply patches so the source tree stays clean for subsequent builds
    cd /project/build/source && dpkg-source --after-build . 2>/dev/null || true
    # Generate source-only buildinfo and changes
    cd /project/build/source && dpkg-genbuildinfo --build=source -O"${BUILD_DIR}/$(dpkg-parsechangelog -S Source)_$(dpkg-parsechangelog -S Version)_source.buildinfo"
    sed -i '/_amd64\.buildinfo/d' /project/build/source/debian/files
    cd /project/build/source && dpkg-genchanges -S -O"${BUILD_DIR}/$(dpkg-parsechangelog -S Source)_$(dpkg-parsechangelog -S Version)_source.changes"
    CHANGES=$(ls "${BUILD_DIR}"/*_source.changes)
    if [ -n "${GPG_KEY_ID:-}" ]; then
      debsign -k "${GPG_KEY_ID}" "${CHANGES}"
    fi
    dput ubuntu-nos "${CHANGES}"
